site_name: Karcytics Flow Cytometry Documentation
site_url: https://KalaimaranB.github.io/Karcytics-flow-cytometry
site_description: Documentation for the Karcytics Flow Cytometry plugin.
site_author: Kalaimaran Balasothy

repo_name: Karcytics Flow Cytometry
repo_url: https://github.com/KalaimaranB/Karcytics-flow-cytometry

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.indexes
    - content.code.annotate
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - "Welcome": index.md
  - "User Guide":
      - "Overview": user/00_OVERVIEW.md
      - "Getting Started": user/01_GETTING_STARTED.md
      - "Workspace": user/02_WORKSPACE.md
      - "Compensation": user/03_COMPENSATION.md
      - "Gating": user/04_GATING.md
      - "Pipeline": user/05_PIPELINE.md
      - "Statistics": user/06_STATISTICS.md
      - "Spectral": user/07_SPECTRAL.md
      - "Population Analysis": user/08_POPULATION_ANALYSIS.md
      - "Comparisons": user/09_COMPARISONS.md
      - "Academy & Guided Tutorials": user/10_ACADEMY_TUTORIALS.md
      - "Scientific Logic": user/11_SCIENTIFIC_LOGIC.md
      - "Keyboard Shortcuts": user/12_KEYBOARD_SHORTCUTS.md
      - "Troubleshooting": user/13_TROUBLESHOOTING.md
      - "Installation": user/14_INSTALLATION.md
  - "Developer Guide":
      - "Architecture Overview": developer/00_ARCHITECTURE_OVERVIEW.md
      - "API Reference": developer/01_API_REFERENCE.md
      - "UI Engine": developer/02_UI_ENGINE.md
      - "Testing & QA": developer/03_TESTING_AND_QA.md
      - "Services & Dependency Injection": developer/04_SERVICES_AND_DEPENDENCY_INJECTION.md
      - "Gating & Compensation Deep Dive": developer/05_GATING_AND_COMPENSATION_DEEP_DIVE.md
      - "Transforms & Scaling": developer/06_TRANSFORMS_AND_SCALING.md
      - "Rendering & Visualization": developer/07_RENDERING_AND_VISUALIZATION.md
      - "Data Flow & Signal Connections": developer/08_DATA_FLOW_AND_SIGNAL_CONNECTIONS.md
