[project]
name = "flow_cytometry"
version = "0.8.6.6"
readme = "README.md"
requires-python = ">=3.11, <3.13"
authors = [
  { name = "Kalaimaran Balasothy" },
]
dependencies = [
    "karcytics-sdk>=2.1.7",
    "msgpack>=1.0.0, <2.0.0",
    "pyobjc-framework-cocoa>=12.2.1 ; sys_platform == 'darwin'",
    "numpy==1.26.4",
    "pandas==3.0.3",
    "matplotlib==3.11.0",
    "scipy==1.17.1",
    "flowkit==1.2.3",
    "fcsparser==0.2.8",
    "flowutils==1.1.0",
    "flowio==1.3.0",
    "scikit-learn==1.9.0",
    "threadpoolctl>=3.6.0, <4.0.0",
    "umap-learn==0.5.12",
    "hdbscan==0.8.44",
    "seaborn==0.13.2",
    "fast-histogram==0.14",
    "pillow>=12.3.0, <13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0, <9.0",
    "pytest-qt>=4.3, <5.0",
    "pytest-cov>=4.1, <5.0",
    "pytest-timeout>=2.3, <3.0",
    "pytest-xdist>=3.5, <4.0",
    "ruff>=0.16, <1.0",
    "mypy>=1.9, <2.0",
    "pip-audit>=2.7, <3.0",
    "pre-commit>=3.6, <4.0",
]

[tool.karcytics.plugin]
id = "flow_cytometry"
display_name = "Flow Cytometry"
min_core_version = "2.0.3"
entry_point = "karcytics_plugins.flow_cytometry:initialize"
process_model = "isolated"
is_beta = true
requires = ["task_scheduler", "logger", "event_bus"]
tags = ["flow cytometry", "gating", "FMO", "compensation", "FCS", "UMAP", "bioinformatics"]
homepage = "https://github.com/KalaimaranB/Karcytics-flow-cytometry"
# tests/ is excluded from the release ZIP (see .github/workflows/release.yml's
# "Build Release ZIP" step), so it must never be hashed into security.json either
# — otherwise the shipped ledger claims files that were never packaged, and
# install-time discovery correctly rejects the plugin as UNTRUSTED.
custom_exclusions = ["tests"]
description = """
A high-performance flow cytometry analysis workspace for Karcytics. \
Features true Logicle transforms, automated spillover compensation, hierarchical gating, \
UMAP dimensionality reduction, spectral unmixing, comprehensive statistics, and reproducible workflow pipelines.\
"""
authors = [
  { name = "Kalaimaran Balasothy", role = "Lead Developer", permissions = ["sign_code"], github = "KalaimaranB", avatar_url = "https://avatars.githubusercontent.com/u/166263319?v=4", details = "Biomedical Engineering student (Bioinformatics & Cellular Engineering) at UBC. Lead architect of Karcytics, specializing in cellular informatics, multi-dimensional lab data processing, and software automation." },
]
contributors = [
  { name = "Sreeparna Vappala", role = "Scientific Advisor", details = "Lecturer, Department of Microbiology and Immunology, UBC. Expertise in cell biology, immunology, and science education pedagogy." },
  { name = "Kabir Bhalla", role = "Scientific Advisor", details = "PhD Candidate, Microbiology & Immunology, UBC. Research focus: polyphosphate contribution to Cryptococcal disease. CGS-D & Four Year Doctoral Fellow."},
  { name = "Cynthia Chung", role = "Scientific Advisor", details = "PhD Candidate, Microbiology & Immunology, UBC. Research focus: age-dependent effects of gammaherpesvirus-68 on autoimmune development in multiple sclerosis mouse models."},
]

[tool.karcytics.plugin.signing]
# Author's Ed25519 public key — trust root: Karcytics Core Authority → Kalaimaran Balasothy
# Verified by trust_chain.json (signature issued by Karcytics Core Authority)
author_public_key = "4a2f07ed63d33c1b5aeb39405a7e7979d93d899836920818a6da317f65c6c6a5"

# Delegated keys: author signs for these identities (e.g. CI/CD bots)
# Verified by delegation.json (signature issued by author)
[[tool.karcytics.plugin.signing.delegated_keys]]
name = "Karcytics Flow Cytometry CI Pipeline"
public_key = "26a928a384d2a2207cff1a5790f5d49b72a7913fda8b03f74fa2a71527ef0f97"
signed_by = "Kalaimaran Balasothy"
role = "ci_runner"


# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
timeout = 120
timeout_method = "thread"
markers = [
    "unit: unit tests (fast, headless)",
    "functional: functional/integration tests",
    "slow: slow running tests",
    "edge_case: edge case tests",
    "ui: tests that require Qt/display",
    "integration: integration tests",
]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Third-party packages without bundled type stubs
module = [
    "PyQt6.*",
    "numpy.*",
    "scipy.*",
    "pandas.*",
    "matplotlib.*",
    "sklearn.*",
    "umap.*",
    "hdbscan.*",
    "seaborn.*",
    "flowkit.*",
    "fcsparser.*",
    "flowutils.*",
    "flowio.*",
    "fast_histogram.*",
    "mpl_toolkits.*",
    "msgpack.*",
    "threadpoolctl.*",
    "karcytics_sdk.*",
    "karcytics.*",
    "sip.*",
    "requests.*",
]
ignore_missing_imports = true

[tool.uv.sources]
karcytics-sdk = { path = "../Karcytics-SDK", editable = true }

[dependency-groups]
dev = [
    "pyqt6>=6.11.0, <7.0.0",
]

[tool.setuptools.package-data]
"karcytics_plugins.flow_cytometry" = ["workflows/*.json", "tutorials/assets/*.fcs"]
